<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3B35B0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Monitor body -->
  <rect x="80" y="90" width="260" height="180" rx="12" ry="12" fill="#e0e0e0" filter="url(#shadow)"/>
  <rect x="92" y="102" width="236" height="148" rx="4" ry="4" fill="url(#screen)"/>
  <!-- Monitor stand -->
  <rect x="180" y="270" width="60" height="25" rx="2" ry="2" fill="#c0c0c0"/>
  <rect x="155" y="290" width="110" height="10" rx="5" ry="5" fill="#b0b0b0"/>
  <!-- Terminal text on screen -->
  <text x="108" y="136" font-family="monospace" font-size="14" fill="#50fa7b">$ UniCent</text>
  <text x="108" y="156" font-family="monospace" font-size="11" fill="#8be9fd">HOST active</text>
  <rect x="108" y="164" width="8" height="14" fill="#f8f8f2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Mouse cursor on screen -->
  <g transform="translate(260, 170)">
    <path d="M0,0 L0,22 L6,17 L12,28 L16,26 L10,15 L18,15 Z" fill="white" stroke="#333" stroke-width="1.5"/>
  </g>
  <!-- WiFi signal waves (outgoing from monitor) -->
  <g transform="translate(380, 160)" filter="url(#glow)">
    <path d="M0,40 Q0,20 20,-5" fill="none" stroke="#50fa7b" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M0,40 Q5,15 30,-15" fill="none" stroke="#50fa7b" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M0,40 Q10,10 40,-20" fill="none" stroke="#50fa7b" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Arrow pointing right (sending) -->
  <g transform="translate(345, 188)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <polyline points="22,-8 30,0 22,8" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Keyboard below -->
  <g transform="translate(90, 340)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="70" rx="8" ry="8" fill="#e8e8e8"/>
    <rect x="4" y="4" width="192" height="62" rx="6" ry="6" fill="#d0d0d0"/>
    <!-- Key rows -->
    <g fill="#f5f5f5" stroke="#bbb" stroke-width="0.5">
      <rect x="10" y="10" width="16" height="14" rx="2"/>
      <rect x="29" y="10" width="16" height="14" rx="2"/>
      <rect x="48" y="10" width="16" height="14" rx="2"/>
      <rect x="67" y="10" width="16" height="14" rx="2"/>
      <rect x="86" y="10" width="16" height="14" rx="2"/>
      <rect x="105" y="10" width="16" height="14" rx="2"/>
      <rect x="124" y="10" width="16" height="14" rx="2"/>
      <rect x="143" y="10" width="16" height="14" rx="2"/>
      <rect x="162" y="10" width="24" height="14" rx="2"/>
      <rect x="14" y="28" width="16" height="14" rx="2"/>
      <rect x="33" y="28" width="16" height="14" rx="2"/>
      <rect x="52" y="28" width="16" height="14" rx="2"/>
      <rect x="71" y="28" width="16" height="14" rx="2"/>
      <rect x="90" y="28" width="16" height="14" rx="2"/>
      <rect x="109" y="28" width="16" height="14" rx="2"/>
      <rect x="128" y="28" width="16" height="14" rx="2"/>
      <rect x="147" y="28" width="38" height="14" rx="2"/>
      <rect x="22" y="46" width="16" height="14" rx="2"/>
      <rect x="42" y="46" width="100" height="14" rx="2"/>
      <rect x="146" y="46" width="16" height="14" rx="2"/>
      <rect x="166" y="46" width="16" height="14" rx="2"/>
    </g>
  </g>
  <!-- "HOST" label -->
  <rect x="330" y="370" width="120" height="44" rx="22" ry="22" fill="white" opacity="0.2"/>
  <text x="390" y="399" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="3">HOST</text>
</svg>
